[package]
name = "oib"
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wenxuanjun/oib"
description = "Sparse GPT disk image builder"

[dependencies]
anyhow = "1.0.98"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
gpt = "4.1.0"
lexopt = "0.3"
tempfile = "3.19.1"
uuid = "1"
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = true
strip = true
