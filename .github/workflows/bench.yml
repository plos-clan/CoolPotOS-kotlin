name: Benchmark

on: [push]

permissions:
  contents: read

jobs:
  jvm:
    uses: ./.github/workflows/build.yml
    with:
      task: jvmBenchmark
      platform: jvm
      artifacts: kernel/build/reports/benchmarks/

  qemu:
    uses: ./.github/workflows/build.yml
    with:
      task: qemuBenchmark
      platform: qemu
      artifacts: kernel/build/qemuBenchmark/results/

  notify:
    if: always()
    needs: [jvm, qemu]
    uses: ./.github/workflows/notify.yml
    with:
      workflow: bench
    secrets: inherit
