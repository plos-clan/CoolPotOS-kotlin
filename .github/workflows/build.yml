name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      task:
        type: string
        default: assemble
      platform:
        type: string
        default: native
      artifacts:
        type: string
        default: kernel/build/kernel.elf

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.task || 'assemble' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.task || 'assemble' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.platform != 'jvm' && 'recursive' || 'false' }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

      - name: Cache Kotlin/Native toolchain
        if: inputs.platform != 'jvm'
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Install latest stable LLVM and Clang
        if: inputs.platform != 'jvm'
        uses: ZhongRuoyu/setup-llvm@v0

      - name: Install native build dependencies
        if: inputs.platform != 'jvm'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            meson \
            ninja-build

      - name: Set up QEMU
        if: inputs.platform == 'qemu'
        run: |
          sudo apt-get install --yes --no-install-recommends acl qemu-system-x86 xorriso
          sudo setfacl --modify "u:$(id -un):rw" /dev/kvm

      - name: Run Gradle
        env:
          GRADLE_TASK: ${{ inputs.task || 'assemble' }}
        run: >-
          ./gradlew "$GRADLE_TASK"
          --no-daemon
          --no-configuration-cache
          --console=plain
          --stacktrace

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CoolPotOS-${{ inputs.task || 'kernel' }}-${{ github.sha }}
          path: |
            ${{ inputs.artifacts || 'kernel/build/kernel.elf' }}
            kernel/build/mlibc-x86_64/meson-logs/
          if-no-files-found: error
          retention-days: 7
