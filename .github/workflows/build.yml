name: Build

on:
  workflow_call:
    inputs:
      task: { type: string, required: true }
      platform: { type: string, required: true }
      artifacts: { type: string, required: true }

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: ${{ inputs.platform != 'jvm' && 'recursive' || 'false' }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

      - name: Cache Kotlin/Native toolchain
        if: inputs.platform != 'jvm'
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-

      - name: Install latest stable LLVM and Clang
        if: inputs.platform != 'jvm'
        uses: ZhongRuoyu/setup-llvm@v0

      - name: Install native build dependencies
        if: inputs.platform != 'jvm'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends meson ninja-build

      - name: Set up QEMU
        if: inputs.platform == 'qemu'
        run: |
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 xorriso
          printf 'SUBSYSTEM=="misc", KERNEL=="kvm", OWNER="%s", MODE="0660"\n' "$(id -un)" |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle

      - name: Run Gradle
        env:
          GRADLE_TASK: ${{ inputs.task }}
        run: >-
          ./gradlew "$GRADLE_TASK"
          --no-daemon
          --no-configuration-cache
          --console=plain
          --stacktrace

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CoolPotOS-${{ inputs.task }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.artifacts }}
            kernel/build/mlibc-x86_64/meson-logs/
          if-no-files-found: error
          retention-days: 7
