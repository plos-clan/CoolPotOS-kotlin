name: Test

on: [push]

permissions:
  contents: read

jobs:
  jvm:
    uses: ./.github/workflows/build.yml
    with:
      task: jvmTest
      platform: jvm
      artifacts: |
        kernel/build/test-results/jvmTest/
        kernel/build/reports/tests/jvmTest/

  qemu:
    uses: ./.github/workflows/build.yml
    with:
      task: qemuTest
      platform: qemu
      artifacts: kernel/build/qemuTest/results/

  notify:
    if: always()
    needs: [jvm, qemu]
    runs-on: ubuntu-24.04
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          repository: ${{ vars.METRICS_REPOSITORY }}
          event-type: metrics-ready
          client-payload: >-
            {
              "runId": ${{ github.run_id }},
              "workflow": ${{ toJSON(github.workflow) }},
              "message": ${{ toJSON(github.event.head_commit.message) }}
            }
