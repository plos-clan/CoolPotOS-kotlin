name: Benchmark

on: [push]

permissions:
  contents: read

jobs:
  jvm:
    uses: ./.github/workflows/build.yml
    with:
      task: jvmBenchmark
      platform: jvm
      artifacts: kernel/build/reports/benchmarks/

  qemu:
    uses: ./.github/workflows/build.yml
    with:
      task: qemuBenchmark
      platform: qemu
      artifacts: kernel/build/qemuBenchmark/results/

  notify:
    if: always()
    needs: [jvm, qemu]
    runs-on: ubuntu-24.04
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          repository: ${{ vars.METRICS_REPOSITORY }}
          event-type: metrics-ready
          client-payload: '{"runId": ${{ github.run_id }}}'
