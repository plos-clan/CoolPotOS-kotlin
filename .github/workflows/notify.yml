name: Notify

on:
  workflow_call:
    inputs:
      workflow: { type: string, required: true }
    secrets:
      METRICS_TOKEN: { required: true }

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          repository: ${{ vars.METRICS_REPOSITORY }}
          event-type: metrics-ready
          client-payload: >-
            {
              "runId": ${{ github.run_id }},
              "workflow": ${{ toJSON(inputs.workflow) }},
              "message": ${{ toJSON(github.event.head_commit.message) }}
            }
